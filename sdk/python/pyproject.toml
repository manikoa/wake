[project]
name = "wake-sdk"
version = "0.1.0"
description = "Wake recorder SDK: records what every agent saw, said and did."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Anthony Maniko", email = "117973652+manikoa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[project.optional-dependencies]
langgraph = [
    "langchain-core>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wake"]

[dependency-groups]
dev = [
    "langgraph>=1.2.18",
    "pytest>=9.1.1",
]
