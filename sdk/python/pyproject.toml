[project]
name = "wake-sdk"
version = "0.1.0"
description = "Wake recorder SDK: records what every agent saw, said and did."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Anthony Maniko", email = "117973652+manikoa@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-exporter-otlp-proto-common>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "requests>=2.32",
]

[project.optional-dependencies]
a2a = [
    "a2a-sdk>=1.2.3",
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.2.174",
]
langchain = [
    "langchain-core>=1.0",
]
langgraph = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
]
mcp = [
    "mcp>=1.20",
]
openai-agents = [
    "openai-agents>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wake"]

[dependency-groups]
dev = [
    "a2a-sdk[http-server]>=1.2.3",
    "claude-agent-sdk>=0.2.174",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.18",
    "mcp>=1.30.0",
    "openai-agents>=0.24.0",
    "pytest>=9.1.1",
]
