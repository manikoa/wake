# Merged over compose.yaml for FLEET_MODELS=real (run.sh adds it), where research calls
# OpenAI and billing runs Claude Code: their model calls go to the provider directly, not
# through agentgateway, so their networks can't be internal. The other agents' networks stay
# closed, and run.sh doesn't check these two for the internet. Model calls through
# agentgateway would let them close too. See "Network" in README.md.
networks:
  research:
    internal: false
  billing:
    internal: false
