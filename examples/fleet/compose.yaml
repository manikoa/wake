# The reference fleet on the staging recorder (deploy/compose.yaml): agents on three
# frameworks, in Python and TypeScript, and the tools they call, all through agentgateway,
# all recorded by Wake, with stand-ins for the identity provider and E2B the brake pulls
# levers on. run.sh brings it up and sends one request through it. Each agent and the tools
# server reaches the rest of the fleet only through agentgateway (networks.yaml). See
# README.md.
name: wake-fleet

include:
  - path: [../../deploy/compose.yaml, networks.yaml]
    env_file: fleet.env

x-image: &image
  image: wake-fleet:dev
  build:
    context: ../..
    dockerfile: examples/fleet/Dockerfile

x-listening: &listening
  interval: 2s
  timeout: 2s
  retries: 30

x-fleet: &fleet
  <<: *image
  environment:
    WAKE_ENDPOINT: https://collector:4318
    WAKE_CA_FILE: /etc/wake/ca/bundle.pem
    FLEET_GATEWAY: http://agentgateway:3000
    FLEET_IDP: http://idp:8080/oauth2/v1
    FLEET_E2B: http://e2b:8080
    WAKE_MEMORY_RULES: http://memory-rules:9003
    FLEET_MODELS: ${FLEET_MODELS:-scripted}
    # Set by a leak game day: a canary the CRM holds, which should never leave it.
    FLEET_CANARY: ${FLEET_CANARY:-}
    # And a credential it holds beside the canary, which the recorders must replace.
    FLEET_CREDENTIAL: ${FLEET_CREDENTIAL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Agents get the CA certificate to reach the collector over TLS, and nothing else from
  # the recorder: no keys, no identity. Each also gets its own credentials from the
  # stand-ins, in a volume no other service but the stand-in issuing them mounts.
  volumes: [ca:/etc/wake/ca:ro]
  depends_on:
    fleet-ca: {condition: service_completed_successfully}
    collector: {condition: service_started}
    idp: {condition: service_healthy}

# The stand-ins start as root to write what they issue into each holder's volume, then run
# as nobody. Their own state, revocations and pauses included, is kept in a volume of theirs.
x-standin: &standin
  <<: *image
  user: "0"
  healthcheck:
    <<: *listening
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080))"]

services:
  # One-shot: copies just the CA certificate out of the identity volume, which also holds
  # the proxy's private key.
  fleet-ca:
    <<: *image
    user: "0"
    entrypoint: ["sh", "-c", "cp /etc/wake/identity/bundle.pem /etc/wake/ca/bundle.pem && chmod 0444 /etc/wake/ca/bundle.pem"]
    volumes: [identity:/etc/wake/identity:ro, ca:/etc/wake/ca]
    network_mode: none
    depends_on:
      identity: {condition: service_completed_successfully}

  # A stand-in for a design partner's identity provider, such as Okta, until a partner's
  # or an Okta developer org takes its place (fleet/standins/oauth.py). It issues each agent
  # a refresh token, gives the tools server a client to introspect tokens with, and gives
  # the brake its client secret, an API token for global token revocation, and a copy of
  # each agent's refresh token.
  idp:
    <<: *standin
    # Each agent signs in there and the tools server introspects tokens there, each from its
    # own network. The brake reaches it on default.
    networks: [default, support, research, billing, notify, tools]
    command: ["python", "-m", "fleet.standins.oauth"]
    environment:
      STANDIN_ISSUER: http://idp:8080
    volumes:
      - idp-state:/var/lib/standin
      - brake-secrets:/out/brake
      - tools-secrets:/out/tools
      - support-secrets:/out/support
      - research-secrets:/out/research
      - billing-secrets:/out/billing
      - notify-secrets:/out/notify

  # A stand-in for E2B, until a partner's account or one of ours takes its place
  # (fleet/standins/e2b.py). Billing keeps a sandbox there, and the brake can freeze it.
  e2b:
    <<: *standin
    networks: [default, billing]
    command: ["python", "-m", "fleet.standins.e2b"]
    volumes:
      - e2b-state:/var/lib/standin
      - brake-secrets:/out/brake
      - billing-secrets:/out/billing

  tools:
    <<: *fleet
    networks: [tools]
    command: ["python", "-m", "fleet.tools"]
    volumes: [ca:/etc/wake/ca:ro, tools-secrets:/etc/fleet/secrets:ro]
    healthcheck:
      <<: *listening
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 3001))"]

  research:
    <<: *fleet
    networks: [research]
    command: ["python", "-m", "fleet.research"]
    volumes: [ca:/etc/wake/ca:ro, research-secrets:/etc/fleet/secrets:ro]
    healthcheck:
      <<: *listening
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9101))"]

  # wake-proxy's memory rules (9003) on billing's network, and nothing else of wake-proxy's:
  # not the brake's control API (9002). See "Network" in README.md.
  memory-rules:
    <<: *image
    networks: [default, billing]
    command: ["python", "-m", "fleet.relay", "9003", "wake-proxy:9003"]
    depends_on:
      wake-proxy: {condition: service_started}
    healthcheck:
      <<: *listening
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9003))"]

  # Billing's memory adapter fetches the brake's quarantines from wake-proxy, through
  # memory-rules, and it keeps a sandbox at E2B.
  billing:
    <<: *fleet
    networks: [billing]
    command: ["python", "-m", "fleet.billing"]
    volumes: [ca:/etc/wake/ca:ro, billing-secrets:/etc/fleet/secrets:ro]
    depends_on:
      fleet-ca: {condition: service_completed_successfully}
      collector: {condition: service_started}
      memory-rules: {condition: service_healthy}
      idp: {condition: service_healthy}
      e2b: {condition: service_healthy}
    healthcheck:
      <<: *listening
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9102))"]

  # The TypeScript agent: Wake's TypeScript SDK on LangGraph.js, in an image of its own.
  notify:
    <<: *fleet
    image: wake-fleet-notify:dev
    build:
      context: ../..
      dockerfile: examples/fleet/notify/Dockerfile
    networks: [notify]
    volumes: [ca:/etc/wake/ca:ro, notify-secrets:/etc/fleet/secrets:ro]
    healthcheck:
      <<: *listening
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 9103))"]

  # One request per run: docker compose run --rm support "<request>"
  support:
    <<: *fleet
    networks: [support]
    command: ["python", "-m", "fleet.support"]
    profiles: [run]
    volumes: [ca:/etc/wake/ca:ro, support-secrets:/etc/fleet/secrets:ro]
    depends_on:
      fleet-ca: {condition: service_completed_successfully}
      idp: {condition: service_healthy}
      agentgateway: {condition: service_started}
      tools: {condition: service_healthy}
      research: {condition: service_healthy}
      billing: {condition: service_healthy}
      notify: {condition: service_healthy}

volumes:
  ca:
  idp-state:
  e2b-state:
  # Each holder's credentials from the stand-ins. brake-secrets is what the brake gets: the
  # stand-ins' admin credentials and its copy of each agent's refresh token. Nothing in the
  # fleet mounts it; the brake does, in a game day.
  brake-secrets:
  tools-secrets:
  support-secrets:
  research-secrets:
  billing-secrets:
  notify-secrets:
