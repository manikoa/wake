# Merged over the staging stack (deploy/compose.yaml) by compose.yaml's include, as
# networks.yaml is: the model providers' keys, for agentgateway's routes to them
# (agentgateway.yaml). With FLEET_MODELS=real, research's and billing's model calls go
# through the gateway, which adds the key, so no agent holds one and every agent's network
# stays internal. Without real models they're empty, and nothing calls those routes.
services:
  agentgateway:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
