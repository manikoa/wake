# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway for the reference fleet: an A2A route per agent, the fleet's MCP server, and
# a route to each model provider for FLEET_MODELS=real, every call checked by wake-proxy and
# denied when the brake has halted it. A2A and MCP calls are recorded there too.
#
# Who's calling comes from the caller's SPIFFE ID or JWT (the agent a delegated token names
# as acting, act.sub, else its subject), as in production, and failing those from the x-fleet-agent header the fleet's agents send. That header is a
# stand-in so the example needs no identity provider; any caller can set it, so never
# trust it outside the example. deploy/agentgateway.yaml requires mTLS instead. wake-proxy's
# hooks are a Unix socket only agentgateway shares (deploy/compose.yaml).
gateways:
  default:
    port: 3000
    # The brake's deny lever, for every call on every route, before routing: a call made by
    # a halted agent is denied wherever it goes. It fails closed: if wake-proxy can't
    # answer, the call is denied. A caller wake-proxy can't name (agents.json) is denied
    # while any agent is halted.
    extAuthz:
      host: "unix:/run/wake/proxy.sock"
      failureMode: deny
      protocol:
        grpc:
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : "")), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
routes:
- name: research
  matches:
  - path:
      pathPrefix: /agents/research
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    # The deny lever again, naming the agent this route reaches, so calls sent to a halted
    # agent are denied too.
    extAuthz:
      host: "unix:/run/wake/proxy.sock"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: research
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : "")), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
    extProc:
      host: "unix:/run/wake/proxy.sock"
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        allowModeOverride: true
      requestAttributes:
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
        # What the sender's JWT says, never the token: whom it acts for, the agents
        # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
        sender_token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
        receiver: '"research"'
  backends:
  - host: research:9101
- name: billing
  matches:
  - path:
      pathPrefix: /agents/billing
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    # The deny lever again, naming the agent this route reaches, so calls sent to a halted
    # agent are denied too.
    extAuthz:
      host: "unix:/run/wake/proxy.sock"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: billing
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : "")), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
    extProc:
      host: "unix:/run/wake/proxy.sock"
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        allowModeOverride: true
      requestAttributes:
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
        # What the sender's JWT says, never the token: whom it acts for, the agents
        # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
        sender_token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
        receiver: '"billing"'
  backends:
  - host: billing:9102
- name: notify
  matches:
  - path:
      pathPrefix: /agents/notify
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    # The deny lever again, naming the agent this route reaches, so calls sent to a halted
    # agent are denied too.
    extAuthz:
      host: "unix:/run/wake/proxy.sock"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: notify
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : "")), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
    extProc:
      host: "unix:/run/wake/proxy.sock"
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        allowModeOverride: true
      requestAttributes:
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
        # What the sender's JWT says, never the token: whom it acts for, the agents
        # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
        sender_token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
        receiver: '"notify"'
  backends:
  - host: notify:9103
- name: tools
  policies:
    mcpGuardrails:
      processors:
      - kind: remote
        host: "unix:/run/wake/proxy.sock"
        failureMode: failOpen
        methods:
          tools/call: full
          resources/read: full
          prompts/get: full
        requestHeaders:
          allowed: [traceparent, wake-parents, mcp-session-id]
        metadata:
          agent: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
          # What the caller's JWT says, never the token: whom it acts for, the agents
          # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
          token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
          wake_event_id: 'has(mcpGuardrails.wake_event_id) ? mcpGuardrails.wake_event_id : ""'
          # The caller's MCP session, in both phases, so a response whose event id didn't come
          # back is paired in order only within its own session.
          session: '"mcp-session-id" in request.headers ? request.headers["mcp-session-id"] : ""'
  backends:
  - mcp:
      targets:
      - name: fleet
        mcp:
          host: http://tools:3001/mcp
# The model providers, for FLEET_MODELS=real: research's OpenAI client and billing's Claude
# Code send their model calls here, so the agents' networks stay internal in that mode too.
# The gateway's deny lever above covers these calls, so a halted agent's model calls are
# denied. The gateway adds the provider's key (models.yaml), which no agent holds; without
# real models the keys are empty and nothing calls these routes.
- name: openai
  matches:
  - path:
      pathPrefix: /models/openai
  policies:
    urlRewrite:
      path:
        prefix: /
    ai:
      routes:
        /v1/responses: responses
        /v1/chat/completions: completions
        "*": passthrough
    backendAuth:
      key: "$OPENAI_API_KEY"
  backends:
  - ai:
      name: openai
      provider:
        openAI: {}
- name: anthropic
  matches:
  - path:
      pathPrefix: /models/anthropic
  policies:
    urlRewrite:
      path:
        prefix: /
    ai:
      routes:
        /v1/messages: messages
        /v1/messages/count_tokens: anthropicTokenCount
        "*": passthrough
    backendAuth:
      key: "$ANTHROPIC_API_KEY"
  backends:
  - ai:
      name: anthropic
      provider:
        anthropic: {}
