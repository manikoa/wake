# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway for the reference fleet: an A2A route per agent and the fleet's MCP server,
# every call recorded by wake-proxy, and denied when the brake has halted it.
#
# Who's calling comes from the caller's SPIFFE ID or JWT subject, as in production, and
# failing those from the x-fleet-agent header the fleet's agents send. That header is a
# stand-in so the example needs no identity provider; any caller can set it, so never
# trust it outside the example. deploy/agentgateway.yaml requires mTLS instead.
gateways:
  default:
    port: 3000
    # The brake's deny lever, for every call on every route, before routing: a call made by
    # a halted agent is denied wherever it goes. It fails closed: if wake-proxy can't
    # answer, the call is denied. A caller wake-proxy can't name (agents.json) is denied
    # while any agent is halted.
    extAuthz:
      host: "wake-proxy:9001"
      failureMode: deny
      protocol:
        grpc:
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))}'
routes:
- name: research
  matches:
  - path:
      pathPrefix: /agents/research
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    # The deny lever again, naming the agent this route reaches, so calls sent to a halted
    # agent are denied too.
    extAuthz:
      host: "wake-proxy:9001"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: research
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))}'
    extProc:
      host: "wake-proxy:9001"
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        allowModeOverride: true
      requestAttributes:
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
        receiver: '"research"'
  backends:
  - host: research:9101
- name: billing
  matches:
  - path:
      pathPrefix: /agents/billing
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    # The deny lever again, naming the agent this route reaches, so calls sent to a halted
    # agent are denied too.
    extAuthz:
      host: "wake-proxy:9001"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: billing
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))}'
    extProc:
      host: "wake-proxy:9001"
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        allowModeOverride: true
      requestAttributes:
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
        receiver: '"billing"'
  backends:
  - host: billing:9102
- name: tools
  policies:
    mcpGuardrails:
      processors:
      - kind: remote
        host: "wake-proxy:9001"
        failureMode: failOpen
        methods:
          tools/call: full
          resources/read: full
          prompts/get: full
        requestHeaders:
          allowed: [traceparent, wake-parents, mcp-session-id]
        metadata:
          agent: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : ("x-fleet-agent" in request.headers ? request.headers["x-fleet-agent"] : ""))'
          wake_event_id: 'has(mcpGuardrails.wake_event_id) ? mcpGuardrails.wake_event_id : ""'
  backends:
  - mcp:
      targets:
      - name: fleet
        mcp:
          host: http://tools:3001/mcp
