# The fleet's networks, merged over the staging recorder (deploy/compose.yaml) by
# compose.yaml's include. Each agent and the tools server has a network of its own (see
# compose.yaml), which agentgateway joins, and the collector too for the agents, which
# send it their events. wake-proxy stays on compose's default network with agentgateway,
# the collector and the brake, and no agent joins it. The stand-ins and memory-rules join
# the agents' networks they serve in compose.yaml. See "Network" in README.md.
services:
  agentgateway:
    networks: [default, support, research, billing, notify, tools]
  # A link to each agent rather than one network they all join: on a shared network every
  # agent could reach every other one.
  collector:
    networks: [default, support, research, billing, notify]
    # Docker takes a published port at the container's own address from every network, even
    # one published on 127.0.0.1 only, so the tools server could reach these. The agents reach
    # the collector on their own networks, and nothing on the host needs it.
    ports: !reset []

networks:
  support:
  research:
  billing:
  notify:
  tools:
