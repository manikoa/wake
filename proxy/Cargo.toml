[package]
name = "wake-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
base64 = "0.23.1"
cedar-policy = "4.13"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["server-auto", "service", "tokio"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
pem = "4.0.0"
prost = "0.14.4"
prost-types = "0.14.4"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.7"
tonic-prost = "0.14.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "0.18.1"

[build-dependencies]
tonic-prost-build = "0.14.7"

[dev-dependencies]
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tower = { version = "0.5.3", features = ["util"] }
yaml-rust2 = "0.13.0"
