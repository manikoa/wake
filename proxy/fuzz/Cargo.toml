# Fuzz targets for everything the processor parses from agents and MCP servers.
# Run with cargo-fuzz on a nightly toolchain: cargo +nightly fuzz run mcp_request
[package]
name = "wake-proxy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.14.4"
serde_json = "1"
wake-proxy = { path = ".." }

# Not part of the proxy's build.
[workspace]
members = ["."]

[[bin]]
name = "mcp_request"
path = "fuzz_targets/mcp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capture_hooks"
path = "fuzz_targets/capture_hooks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a2a_exchange"
path = "fuzz_targets/a2a_exchange.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authz_check"
path = "fuzz_targets/authz_check.rs"
test = false
doc = false
bench = false
