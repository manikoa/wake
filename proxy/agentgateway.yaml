# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway v1.6.0 config that records MCP calls and A2A messages through wake-proxy.
# agentgateway serves the agents on port 3000 and calls wake-proxy on localhost:9001: its
# ExtMCP hook for MCP calls, and its ext_proc hook for A2A messages.
gateways:
  default:
    port: 3000
routes:
# An A2A agent. Add one route like this per agent.
- matches:
  - path:
      pathPrefix: /agents/research
  policies:
    a2a: {}
    extProc:
      host: "localhost:9001"
      # Calls that start while wake-proxy is down go through unrecorded. One that's in
      # progress when it dies fails: agentgateway's ext_proc fails open only until body
      # bytes reach the processor.
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        # wake-proxy switches streamed (text/event-stream) replies to full duplex, so
        # they aren't held until they end.
        allowModeOverride: true
      requestAttributes:
        # Who's sending: the agent's SPIFFE ID from mTLS, else its JWT subject.
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : "")'
        # Who's receiving: the agent behind this route.
        receiver: '"research"'
  backends:
  - host: localhost:9999
# MCP servers.
- policies:
    mcpGuardrails:
      processors:
      - kind: remote
        host: "localhost:9001"
        # Recording never blocks: if wake-proxy is down or slow, calls go through
        # unrecorded. Deny, in the Brake phase, goes in its own processor and fails closed.
        failureMode: failOpen
        methods:
          tools/call: full
          resources/read: full
          prompts/get: full
        # Only these request headers reach wake-proxy; with no list, agentgateway would
        # forward every header, credentials included. A caller with a Wake SDK links its
        # MCP calls into its own trace and provenance with traceparent and wake-parents.
        requestHeaders:
          allowed: [traceparent, wake-parents, mcp-session-id]
        # Sent to wake-proxy with each hook. A failing expression is left out.
        metadata:
          # Who's calling: the agent's SPIFFE ID from mTLS, else its JWT subject.
          agent: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.sub) ? jwt.sub : "")'
          # The event id wake-proxy handed back from the request hook, so the response
          # hook can say which call it belongs to.
          wake_event_id: 'has(mcpGuardrails.wake_event_id) ? mcpGuardrails.wake_event_id : ""'
  backends:
  - mcp:
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
