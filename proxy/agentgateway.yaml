# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway v1.6.0 config that records MCP calls and A2A messages through wake-proxy,
# and denies the calls the brake has halted. agentgateway serves the agents on port 3000
# and calls wake-proxy on localhost:9001: its ExtMCP hook for MCP calls, its ext_proc hook
# for A2A messages, and its ext_authz hook for the deny lever.
gateways:
  default:
    port: 3000
    # Every caller authenticates, so the deny lever and the record know which agent each
    # call is from. Here agents present their X.509-SVIDs (mTLS); the files are what
    # `wake-proxy dev-identity --gateway-host localhost --agent <name>` writes. Or validate
    # their JWTs with a gateway-level jwtAuth (mode: strict) instead. Either must be on the
    # gateway, not a route: the gateway's extAuthz below runs before any route's policies.
    tls:
      cert: keys/gateway/gateway.pem
      key: keys/gateway/gateway.key
      root: keys/gateway/bundle.pem
    # The brake's deny lever, for every call on every route. It fails closed: if wake-proxy
    # can't answer, the call is denied. Deny, unlike capture, never fails open. Never give
    # it a cache, or a halt waits for the cache to expire.
    extAuthz:
      host: "localhost:9001"
      failureMode: deny
      protocol:
        grpc:
          metadata:
            # Who's calling: the agent's SPIFFE ID from mTLS, else the agent a delegated JWT
            # names as acting (act.sub), else its subject.
            # wake-proxy's --agents map turns it into the name the brake halts by.
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ""), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
routes:
# An A2A agent. Add one route like this per agent.
- matches:
  - path:
      pathPrefix: /agents/research
  policies:
    a2a: {}
    # The deny lever again, naming the agent behind this route, so calls sent to a halted
    # agent are denied too. Every A2A route needs one.
    extAuthz:
      host: "localhost:9001"
      failureMode: deny
      protocol:
        grpc:
          context:
            receiver: research
          metadata:
            wake: '{"agent": has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : ""), "token": {"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}}'
    extProc:
      host: "localhost:9001"
      # Calls that start while wake-proxy is down go through unrecorded. One that's in
      # progress when it dies fails: agentgateway's ext_proc fails open only until body
      # bytes reach the processor.
      failureMode: failOpen
      processingOptions:
        requestHeaderMode: send
        requestBodyMode: bufferedPartial
        responseHeaderMode: send
        responseBodyMode: bufferedPartial
        requestTrailerMode: skip
        responseTrailerMode: skip
        # wake-proxy switches streamed (text/event-stream) replies to full duplex, so
        # they aren't held until they end.
        allowModeOverride: true
      requestAttributes:
        # Who's sending: the agent's SPIFFE ID from mTLS, else the agent a delegated JWT
        # names as acting (act.sub), else its subject.
        sender: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : "")'
        # What the sender's JWT says, never the token: whom it acts for, the agents
        # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
        sender_token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
        # Who's receiving: the agent behind this route.
        receiver: '"research"'
  backends:
  - host: localhost:9999
# MCP servers.
- policies:
    mcpGuardrails:
      processors:
      - kind: remote
        host: "localhost:9001"
        # This hook also holds each call to the flow rules that name tools and a charter's
        # limits, so a call it can't answer for is refused, not sent on unchecked. Recording
        # still never blocks: with wake-proxy up, the hook answers whatever becomes of the record.
        failureMode: failClosed
        methods:
          tools/call: full
          resources/read: full
          prompts/get: full
        # Only these request headers reach wake-proxy; with no list, agentgateway would
        # forward every header, credentials included. A caller with a Wake SDK links its
        # MCP calls into its own trace and provenance with traceparent and wake-parents.
        requestHeaders:
          allowed: [traceparent, wake-parents, mcp-session-id]
        # Sent to wake-proxy with each hook. A failing expression is left out.
        metadata:
          # Who's calling: the agent's SPIFFE ID from mTLS, else the agent a delegated JWT
          # names as acting (act.sub), else its subject.
          agent: 'has(source.spiffeId) ? source.spiffeId : (has(jwt.act) && has(jwt.act.sub) ? jwt.act.sub : has(jwt.sub) ? jwt.sub : "")'
          # What the caller's JWT says, never the token: whom it acts for, the agents
          # acting, its id and expiry, and whether it's bound to a key. wake-proxy records it.
          token: '{"sub": has(jwt.sub) ? jwt.sub : "", "jti": has(jwt.jti) ? jwt.jti : "", "uti": has(jwt.uti) ? jwt.uti : "", "exp": has(jwt.exp) ? jwt.exp : 0, "act": has(jwt.act) ? jwt.act : {}, "cnf": has(jwt.cnf)}'
          # The event id wake-proxy handed back from the request hook, so the response
          # hook can say which call it belongs to.
          wake_event_id: 'has(mcpGuardrails.wake_event_id) ? mcpGuardrails.wake_event_id : ""'
          # The caller's MCP session, in both phases, so a response whose event id didn't come
          # back is paired in order only within its own session.
          session: '"mcp-session-id" in request.headers ? request.headers["mcp-session-id"] : ""'
  backends:
  - mcp:
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
