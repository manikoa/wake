# Builds the Wake collector: the standard OTLP receiver plus Wake's signing
# processor and signed log exporter. Run: make -C collector build
dist:
  name: wake-collector
  description: Wake collector
  output_path: ./build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0

processors:
  - gomod: github.com/manikoa/wake/collector v0.0.0
    import: github.com/manikoa/wake/collector/processor/wakesignprocessor

exporters:
  - gomod: github.com/manikoa/wake/collector v0.0.0
    import: github.com/manikoa/wake/collector/exporter/wakelogexporter
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0

replaces:
  - github.com/manikoa/wake/collector => ../
  - github.com/manikoa/wake/log => ../../log
