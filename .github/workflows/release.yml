# Releases the open source recorder when a vX.Y.Z tag is pushed: the collector and
# wake-proxy images on GHCR, wake-log and wake-keygen for checking a log without Wake,
# the Python SDK on PyPI and the TypeScript SDK on npm. Every artifact is signed with
# Sigstore, keyless, by this workflow's own identity, and gets SLSA build provenance and
# an SBOM; the release lists every file's SHA-256 in a signed SHA256SUMS. How to cut a
# release and how to verify one are in docs/releases.md. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag names the release; both SDKs and the proxy must say the same version.
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sdk=$(sed -n 's/^version = "\(.*\)"$/\1/p' sdk/python/pyproject.toml | head -1)
          ts=$(jq -r .version sdk/typescript/package.json)
          proxy=$(sed -n 's/^version = "\(.*\)"$/\1/p' proxy/Cargo.toml | head -1)
          [ "$sdk" = "$version" ] || { echo "::error::sdk/python/pyproject.toml says $sdk, not $version"; exit 1; }
          [ "$ts" = "$version" ] || { echo "::error::sdk/typescript/package.json says $ts, not $version"; exit 1; }
          [ "$proxy" = "$version" ] || { echo "::error::proxy/Cargo.toml says $proxy, not $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wake-collector
            dockerfile: collector/Dockerfile
          - image: wake-proxy
            dockerfile: proxy/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          # The attestations below are the provenance and the SBOM.
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.image }}_${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.image }}_${{ needs.version.outputs.version }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}_${{ needs.version.outputs.version }}.spdx.json

  cli:
    name: wake-log and wake-keygen
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: log
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: log/go.mod
          cache-dependency-path: log/go.sum
      # Tessera's log storage locks files the Unix way, so there's no Windows build.
      - name: Build
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            dir="wake-log_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$dir"
            for cmd in wake-log wake-keygen; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$dir/$cmd" "./cmd/$cmd"
            done
            cp ../LICENSE ../NOTICE "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "dist/$dir"
          done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: log/dist/*.tar.gz
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: log
          format: spdx-json
          output-file: log/dist/wake-log_${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: log/dist/*.tar.gz
          sbom-path: log/dist/wake-log_${{ needs.version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: log/dist/*

  sdk:
    name: Python SDK
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        working-directory: sdk/python
        run: uv build --out-dir dist
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk/python/dist/*
      # Kept out of dist/, which is exactly what goes to PyPI.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/python
          format: spdx-json
          output-file: wake-sdk_${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sdk/python/dist/*
          sbom-path: wake-sdk_${{ needs.version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk
          path: sdk/python/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-sdk
          path: wake-sdk_${{ needs.version.outputs.version }}.spdx.json

  sdk-typescript:
    name: TypeScript SDK
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # prepack builds it, and copies in the repository's LICENSE and NOTICE.
      - name: Pack
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          mkdir pack && pnpm pack --pack-destination pack
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk/typescript/pack/*
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/typescript
          format: spdx-json
          output-file: wake-sdk-typescript_${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sdk/typescript/pack/*
          sbom-path: wake-sdk-typescript_${{ needs.version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-typescript
          path: sdk/typescript/pack/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-sdk-typescript
          path: wake-sdk-typescript_${{ needs.version.outputs.version }}.spdx.json

  release:
    name: GitHub release
    needs: [version, images, cli, sdk, sdk-typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signed checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Wake $GITHUB_REF_NAME" --generate-notes --notes "$(cat <<EOF
          Images: \`ghcr.io/$OWNER/wake-collector:$VERSION\` and \`ghcr.io/$OWNER/wake-proxy:$VERSION\`. The SDKs: \`pip install wake-sdk==$VERSION\` and \`npm install wake-sdk@$VERSION\`.

          Every artifact is signed with Sigstore and has SLSA build provenance and an SBOM. How to check them: [docs/releases.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/releases.md).
          EOF
          )" assets/*

  pypi:
    name: publish the SDK to PyPI
    needs: release
    runs-on: ubuntu-latest
    # PyPI trusts this workflow and environment, not a token (docs/releases.md).
    environment:
      name: pypi
      url: https://pypi.org/project/wake-sdk/
    permissions:
      id-token: write # trusted publishing, and the PEP 740 attestations PyPI shows
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: publish the TypeScript SDK to npm
    needs: [version, release]
    runs-on: ubuntu-latest
    # npm trusts this workflow and environment, not a token (docs/releases.md).
    environment:
      name: npm
      url: https://www.npmjs.com/package/wake-sdk
    permissions:
      id-token: write # trusted publishing, and the provenance npm shows
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-typescript
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The tarball the release attested, as it is: publishing it runs no build.
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] || { echo "::error::npm $v can't use trusted publishing, which needs 11.5.1 or later"; exit 1; }
          npm publish "pack/wake-sdk-$VERSION.tgz" --provenance --access public
