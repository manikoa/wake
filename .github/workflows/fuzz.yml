# Fuzzes everything the proxy parses from agents and MCP servers (docs/proxy.md): every
# night for five minutes a target, and for a minute on any pull request that changes the
# fuzz targets or the code they reach in proxy/src. Each target starts from the corpus
# earlier runs built. A crash fails the job and keeps the input that caused it. cargo-fuzz
# needs a nightly toolchain, pinned here to a date so a nightly regression can't fail the
# job; move it forward now and then.
name: Fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - proxy/fuzz/**
      - proxy/src/**
      - proxy/Cargo.lock
      - .github/workflows/fuzz.yml

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY: nightly-2026-10-20

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [mcp_request, capture_hooks, canonical, a2a_exchange, authz_check, flow_policy, redact, model_call]
    defaults:
      run:
        working-directory: proxy/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: proxy/fuzz
          key: fuzz
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proxy/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '300' }}
        run: |
          [[ "$SECONDS_PER_TARGET" =~ ^[0-9]+$ ]] || { echo "seconds must be a number" >&2; exit 2; }
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +"$NIGHTLY" fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048
      # Only scheduled and manual runs grow the corpus every run starts from.
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proxy/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep the input that crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: proxy/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
