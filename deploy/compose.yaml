# The open source recorder, for a staging environment: the collector, which signs events
# and keeps the signed log; wake-proxy, which also enforces the brake's halts; and
# agentgateway in front of your MCP servers and A2A agents (agentgateway.yaml), which
# requires every agent to present its SVID. Keys, a development identity and the halts
# state are created on first start and kept in volumes. See deploy/README.md.
name: wake

x-collector-image: &collector-image
  image: ghcr.io/manikoa/wake-collector:${WAKE_VERSION:-dev}
  build:
    context: ..
    dockerfile: collector/Dockerfile

x-proxy-image: &proxy-image
  image: ghcr.io/manikoa/wake-proxy:${WAKE_VERSION:-dev}
  build:
    context: ..
    dockerfile: proxy/Dockerfile

services:
  # One-shot: the collector's event signing key and the log's checkpoint key.
  collector-keys:
    <<: *collector-image
    entrypoint: ["/wake-keygen"]
    command: ["-keep-existing", "-name", "wake-collector", "-out", "/etc/wake/keys/collector"]
    volumes: [keys:/etc/wake/keys]
  log-keys:
    <<: *collector-image
    entrypoint: ["/wake-keygen"]
    command: ["-keep-existing", "-name", "wake-log", "-out", "/etc/wake/keys/log"]
    volumes: [keys:/etc/wake/keys]
  # One-shot: a development CA standing in for SPIRE, the proxy's SVID, the collector's TLS
  # certificate, the brake's SVID for the proxy's control API, agentgateway's TLS
  # certificate, and an SVID for each agent in WAKE_DEV_AGENTS (comma separated), written
  # to identity/agents/<name>.pem and .key. Production gets these from SPIRE.
  identity:
    <<: *proxy-image
    command: ["dev-identity", "--keep-existing", "--out", "/etc/wake/identity", "--spiffe-id", "spiffe://wake.local/proxy",
              "--tls-host", "collector", "--tls-host", "localhost", "--brake-id", "spiffe://wake.local/brake",
              "--gateway-host", "agentgateway", "--gateway-host", "localhost", "--gateway-out", "/etc/wake/gateway",
              "--agent", "${WAKE_DEV_AGENTS:-research,smoke-test}"]
    volumes: [identity:/etc/wake/identity, gateway-identity:/etc/wake/gateway]
  # One-shot: the halts state, initialized once when its volume is new. A wake-proxy that
  # starts without it denies every call, so losing the volume can't quietly lift a halt.
  proxy-state:
    <<: *proxy-image
    command: ["init", "--state-dir", "/var/lib/wake-proxy", "--keep-existing"]
    volumes: [proxy-state:/var/lib/wake-proxy]

  collector:
    <<: *collector-image
    depends_on:
      collector-keys: {condition: service_completed_successfully}
      log-keys: {condition: service_completed_successfully}
      identity: {condition: service_completed_successfully}
    volumes:
      - keys:/etc/wake/keys:ro
      - identity:/etc/wake/identity:ro
      - data:/var/lib/wake
    # OTLP, then the health check and the collector's metrics for Prometheus on this host.
    # On this network they're collector:13133 and collector:8888/metrics.
    ports: ["4318:4318", "127.0.0.1:13133:13133", "127.0.0.1:8888:8888"]
    restart: unless-stopped

  wake-proxy:
    <<: *proxy-image
    depends_on:
      identity: {condition: service_completed_successfully}
      proxy-state: {condition: service_completed_successfully}
      collector: {condition: service_started}
    command: ["serve", "--listen", "unix:/run/wake/proxy.sock",
              "--key", "/etc/wake/identity/proxy.key", "--cert", "/etc/wake/identity/proxy.pem",
              "--collector", "https://collector:4318", "--collector-ca", "/etc/wake/identity/bundle.pem",
              "--state-dir", "/var/lib/wake-proxy", "--agents", "/etc/wake/agents.json",
              "--control-listen", "0.0.0.0:9002", "--trust-bundle", "/etc/wake/identity/bundle.pem",
              "--memory-listen", "0.0.0.0:9003"]
    environment:
      RUST_LOG: info
    volumes:
      - identity:/etc/wake/identity:ro
      # The halts in force, kept so a restart doesn't lift one.
      - proxy-state:/var/lib/wake-proxy
      # Which agent each SPIFFE ID or JWT subject is: the names the brake halts by.
      # WAKE_AGENTS swaps in another map, as the reference fleet does.
      - ${WAKE_AGENTS:-./agents.json}:/etc/wake/agents.json:ro
      # The hooks agentgateway calls, as a Unix socket. Only agentgateway mounts this too:
      # anything that can reach the hooks can get events signed in the proxy's name.
      - proxy-socket:/run/wake
    # Not published. Only the brake, which alone has the SVID the control API checks, may
    # use 9002. Memory adapters read their quarantine rules from 9003.
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    depends_on:
      identity: {condition: service_completed_successfully}
      wake-proxy: {condition: service_started}
    command: ["-f", "/etc/agentgateway/config.yaml"]
    # WAKE_GATEWAY_CONFIG swaps in another config, as the reference fleet does. The gateway
    # gets its own TLS certificate and the trust bundle, never the proxy's or the brake's keys.
    volumes:
      - "${WAKE_GATEWAY_CONFIG:-./agentgateway.yaml}:/etc/agentgateway/config.yaml:ro"
      - gateway-identity:/etc/wake/gateway:ro
      - proxy-socket:/run/wake
    ports: ["3000:3000"]
    # Lets the example backends in agentgateway.yaml reach services on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

volumes:
  keys:
  identity:
  gateway-identity:
  proxy-state:
  proxy-socket:
  data:
